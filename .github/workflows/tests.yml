name: Tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the search tool's one dependency
        run: pip install -r requirements.txt
      - name: Search tool, scorer and Ember's check, against a simulated Ember with the network refused
        run: python -m unittest discover -s probe
      - name: Detector runner and scoring, with a stand-in for the detector library
        run: python -m unittest discover -s detector
      - name: Recorded flight replay fixtures
        run: python -m unittest discover -s runs/live-detector-check
      - name: Offline first-five replay audit
        run: python -m unittest discover -s runs/first-five-audit
  judge-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/judge-browser" --ignore-scripts playwright@1.54.2
      - name: Check the desktop, phone and offline crew handoff
        run: |
          python3 -m http.server 8757 --bind 127.0.0.1 > "$RUNNER_TEMP/judge-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused --fail --silent --output /dev/null http://127.0.0.1:8757/pages/0014.html
          NODE_PATH="$RUNNER_TEMP/judge-browser/node_modules" CHROME_BIN="$(command -v google-chrome)" node probe/test_0014_browser.cjs http://127.0.0.1:8757
